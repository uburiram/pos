<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>เมนู - สั่งอาหาร</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/icon/favicon-32.png">
  <link rel="apple-touch-icon" href="/icon/apple-touch-icon-180.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#e94560">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container">
    <header class="header center">
      <img src="/icon/icon-192.png" alt="Logo" class="logo-sm" width="64" height="64">
      <h1 id="shop-name">ร้านอาหาร</h1>
      <p class="subtitle">เลือกเมนูแล้วกดสั่ง</p>
    </header>

    <div id="menu-list" class="menu-grid"></div>

    <div id="cart-bar" class="cart-bar hidden">
      <div class="cart-info">
        <span id="cart-count">0 รายการ</span>
        <strong id="cart-total">0 บาท</strong>
      </div>
      <button id="btn-checkout" class="btn btn-primary">สั่งอาหาร</button>
    </div>

    <div id="checkout-modal" class="modal hidden">
      <div class="modal-content">
        <h2>ยืนยันออเดอร์</h2>
        <div id="checkout-items"></div>
        <div class="form-group">
          <label>ชื่อ (ไม่บังคับ)</label>
          <input type="text" id="customer-name" placeholder="เช่น คุณเอ" maxlength="30">
        </div>
        <div class="form-group">
          <label>หมายเหตุ</label>
          <input type="text" id="order-note" placeholder="เช่น ไม่ใส่ผัก, เผ็ดน้อย" maxlength="100">
        </div>
        <div class="total-line">
          รวม <strong id="checkout-total">0</strong> บาท
        </div>
        <div class="modal-actions">
          <button id="btn-cancel" class="btn btn-secondary">ยกเลิก</button>
          <button id="btn-confirm" class="btn btn-success">ยืนยันสั่ง + ชำระเงิน</button>
        </div>
      </div>
    </div>

    <div id="result-modal" class="modal hidden">
      <div class="modal-content center">
        <h2>✅ สั่งสำเร็จ</h2>
        <div class="queue-number">
          คิวที่ <span id="result-queue">-</span>
        </div>
        <p>ยอดชำระ <strong id="result-total">0</strong> บาท</p>
        <p class="small">สแกน QR ด้านล่างด้วยแอปธนาคารเพื่อชำระเงิน</p>
        <img id="promptpay-qr" alt="PromptPay QR" style="max-width:260px;margin:12px auto;display:block;">
        <p class="small mono" id="result-note"></p>
        <button id="btn-done" class="btn btn-primary full">เสร็จสิ้น / สั่งใหม่</button>
      </div>
    </div>
  </div>
  <script src="/js/menu.js"></script>
</body>
</html>
